<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Members - Set Operators</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        .club-banner {
             background-color: #2a1442; 
             color: #f8fafc;
             padding: 25px 20px;
             border-radius: 10px;
             text-align: center;
             margin-bottom: 25px;
             border-bottom: 5px solid #972fd4;
        }

        .club-banner h1 {
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }
            
        .club-banner p {
             margin: 5px 0 0;
             color: #94a3b8;
              font-size: 0.95rem;
        }
        .output-box {
            background-color: #972fd4;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .form-control:focus {
        border-color: #ced4da; 
        box-shadow: none;
    }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">

        <div class="club-banner">
            <h1>Cool Kids Club</h1>
        </div>

        <h3 class="mb-3">Add new club member:</h3>


        <div class="mb-3">
            <input type="text" id="fname" class="form-control" placeholder="Enter first name">
        </div>

        <div class="mb-3">
            <input type="text" id="lname" class="form-control" placeholder="Enter last name">
        </div>

        <button type="button" class="btn btn-primary" py-click="add_member">Submit</button>

        <div id="output" class="output-box d-none"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
